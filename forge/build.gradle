plugins {
	id 'multiloader-loader'
	id 'com.gradleup.shadow' version '9.6.+'
	id 'com.modrinth.minotaur' version '2.+'
}

architectury {
	forge()
}

loom {
	accessWidenerPath = project(":common").loom.accessWidenerPath

	mixin {
		useLegacyMixinAp = true
		defaultRefmapName.set("${mod_id}.refmap.json")
	}

	forge {
		convertAccessWideners = true
		mixinConfig "${mod_id}.mixins.json"
		mixinConfig "${mod_id}.forge.mixins.json"
		extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
	}

	runs {
		client {
			vmArg "-Dmixin.env.disableRefMap=true"
			property "mixin.env.disableRefMap", "true"
		}
	}
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentForge.extendsFrom common
}

dependencies {
	forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	compileOnly project(":common")
	annotationProcessor "org.spongepowered:mixin:0.8.5-SNAPSHOT:processor"
	compileOnly annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0")
	implementation include("io.github.llamalad7:mixinextras-forge:0.5.0")
	implementation annotationProcessor("com.google.auto.service:auto-service:1.1.1")

	compileOnly "org.joml:joml:1.10.5"
	forgeRuntimeLibrary "org.joml:joml:1.10.5"
	compileOnly "org.joml:joml-primitives:1.10.0"
	forgeRuntimeLibrary "org.joml:joml-primitives:1.10.0"

	compileOnly "thedarkcolour:kotlinforforge:${kff_version}"
	forgeRuntimeLibrary "thedarkcolour:kotlinforforge:${kff_version}"

	modCompileOnly("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false }
	modRuntimeOnly("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false }

	compileOnly "org.valkyrienskies.core:api:${vs_core_version}"
	forgeRuntimeLibrary("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false }
	compileOnly "org.valkyrienskies.core:impl:${vs_core_version}"
	compileOnly "org.valkyrienskies.core:internal:${vs_core_version}"
	compileOnly "org.valkyrienskies.core:util:${vs_core_version}"
	forgeRuntimeLibrary("org.valkyrienskies.core:util:${vs_core_version}") { transitive = false }

	//////// BEGIN VS DEPDENCIES ////////
	// have to copy paste all the dependencies from VS forge/build.gradle, but it works!

	forgeRuntimeLibrary("javax.inject:javax.inject:1") { transitive = false }

	// JOML for Math
	forgeRuntimeLibrary("org.joml:joml-primitives:1.10.0")

	// Apache Commons Math for Linear Programming
	forgeRuntimeLibrary("org.apache.commons:commons-math3:3.6.1") { transitive = false }

	// Jackson Binary Dataformat for Object Serialization
	def jacksonVersion = '2.14.0'
	// forked to remove module-info
	forgeRuntimeLibrary("com.fasterxml.jackson.module:jackson-module-kotlin:$jacksonVersion-rubyfork") { transitive = false }
	forgeRuntimeLibrary("com.fasterxml.jackson.module:jackson-module-parameter-names:$jacksonVersion") { transitive = false }
	forgeRuntimeLibrary("com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:$jacksonVersion") { transitive = false }
	forgeRuntimeLibrary("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion") { transitive = false }
	forgeRuntimeLibrary("com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion") { transitive = false }
	forgeRuntimeLibrary("com.fasterxml.jackson.core:jackson-core:$jacksonVersion") { transitive = false }
	forgeRuntimeLibrary("com.github.Rubydesic:jackson-kotlin-dsl:1.2.0") { transitive = false }

	forgeRuntimeLibrary("com.networknt:json-schema-validator:1.0.71") { transitive = false }
	forgeRuntimeLibrary("com.ethlo.time:itu:1.7.0") { transitive = false }
	forgeRuntimeLibrary("com.github.victools:jsonschema-module-jackson:4.25.0") { transitive = false }
	forgeRuntimeLibrary("com.github.victools:jsonschema-generator:4.25.0") { transitive = false }
	forgeRuntimeLibrary("com.fasterxml:classmate:1.5.1") { transitive = false }
	forgeRuntimeLibrary("com.flipkart.zjsonpatch:zjsonpatch:0.4.11") { transitive = false }
	forgeRuntimeLibrary("org.apache.commons:commons-collections4:4.3") { transitive = false }

	forgeRuntimeLibrary("com.google.dagger:dagger:2.43.2") { transitive = false }

	//////// END VS DEPDENCIES ////////

	modCompileOnly "maven.modrinth:jade:${jade_version}+forge"
	// modRuntimeOnly "maven.modrinth:jade:${jade_version}+forge"

	modCompileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}"
}

shadowJar {
	exclude "fabric.mod.json"
	exclude "architectury.common.json"

	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set "dev-shadow"
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set null
}

jar {
	archiveClassifier.set "dev"
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "${modrinth_project_id}"
	versionNumber = "${minecraft_version}-forge-${version}"
	versionType = "release"
	uploadFile = jar
	gameVersions = [minecraft_version]
	loaders = ["forge", "neoforge"]
	dependencies {
		required.project "valkyrien-skies"
	}
}
